<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>TrikTrak wie die alte App</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<!-- Entwurf "Bedienung wie die alte App" (2026-11-15): ein Hauptbildschirm mit Reitern Set/Archiv,
     Setliste in der Mitte, feste Player-Leiste unten, Wischen rechts = als Nächstes, links = ans Ende.
     Optik und Schriftgrößen wie Fassung 7 auf dem Mudita. 360x600 wie der Kompakt (Faktor 1,333 = 480x800),
     inklusive Android-Statusleiste, damit der Platz ehrlich ist.
     Ohne #: Übersicht. Mit #1 … #9: nur diese Seite (für die Einzelbilder). -->
<style>
  body{margin:0;background:#e9e9e9;font-family:'Barlow Semi Condensed','Arial Narrow',sans-serif}
  *{box-sizing:border-box}
  .raster{display:flex;flex-wrap:wrap;gap:28px;padding:24px}
  figure{margin:0;display:flex;flex-direction:column;gap:10px;width:360px}
  figcaption{font-size:19px;font-weight:600;line-height:1.25;color:#000}
  figcaption b{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800;display:block}
  .einzeln{background:#fff}
  .einzeln .raster{padding:0;gap:0}
  .einzeln figcaption{display:none}
  .einzeln figure{display:none}
  .einzeln figure.an{display:flex}
  .s{width:360px;height:600px;background:#fff;color:#000;display:flex;flex-direction:column;overflow:hidden;position:relative;outline:1px solid #bbb}
  .einzeln .s{outline:none}
  .status{height:36px;flex:none;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:500;font-family:Arial,sans-serif}
  .et{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;line-height:1.1}
  .ti{font-family:'Barlow Condensed',sans-serif;font-weight:700;line-height:1.02}

  /* Kopf mit zwei Reitern */
  .kopf{background:#000;color:#fff;padding:7px 10px 10px;flex:none;display:flex;flex-direction:column;gap:6px}
  .kopf .et{padding-left:4px}
  .reiter{display:flex;gap:8px}
  .rt{height:44px;border:2.5px solid #fff;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:25px;color:#fff}
  .rt.an{background:#fff;color:#000}
  .rt.set{flex:1.5}.rt.arch{flex:1}

  /* Setliste */
  .liste{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
  .zeile{height:60px;margin:0 10px;padding:0 6px;border-bottom:1px solid #000;display:flex;align-items:center;gap:10px;background:#fff;position:relative}
  .nr{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:23px;width:22px;text-align:center;flex:none}
  .mitte{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .tt{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;line-height:1;white-space:nowrap;overflow:hidden}
  .unter{display:flex;gap:6px;align-items:center}
  .chip{border:2px solid #000;border-radius:7px;padding:0 6px;font-size:14px;font-weight:700;white-space:nowrap;line-height:1.3}
  .chip.sw{background:#000;color:#fff}
  .klein{font-size:14px;font-weight:600}
  .dauer{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:23px;flex:none}
  .naechst{border-top:2.5px solid #000;border-bottom:2.5px solid #000;margin-top:4px}
  .naechst .marke{position:absolute;top:-9px;left:34px;background:#fff;padding:0 5px;font-size:12px;font-weight:700;letter-spacing:.08em}
  .grau{opacity:.38}
  .fuss{margin-top:auto;padding:4px 16px 5px;display:flex;justify-content:space-between;font-size:14px;font-weight:600}

  /* Wischen */
  .wisch{margin:0 10px;height:60px;position:relative;overflow:hidden;border-bottom:1px solid #000}
  .wisch .grund{position:absolute;inset:0;background:#000;color:#fff;display:flex;align-items:center;padding:0 14px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;letter-spacing:.03em;gap:8px}
  .wisch .grund.rechts{justify-content:flex-end}
  .wisch .zeile{position:absolute;top:0;width:100%;margin:0;border:2.5px solid #000;border-radius:10px}
  .band{margin:6px 10px 2px;background:#000;color:#fff;border-radius:12px;padding:8px 12px;font-size:16px;font-weight:700;line-height:1.2;display:flex;align-items:center;gap:10px}
  .band u{text-decoration:none;border:2px solid #fff;border-radius:8px;padding:3px 9px;white-space:nowrap;margin-left:auto}

  /* Player-Leiste */
  .pl{background:#000;color:#fff;flex:none;padding:8px 12px 10px;display:flex;flex-direction:column;gap:5px}
  .pl .zeilen{display:flex;align-items:flex-end;gap:8px}
  .kaest{display:flex;gap:3px}.kaest span{flex:1;height:6px;border:1.5px solid #fff;border-radius:2px}.kaest span.v{background:#fff}
  .knr{display:flex;gap:8px;margin-top:3px}
  .kn{flex:1;height:58px;border:2.5px solid #fff;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:15px;font-weight:700;color:#fff}
  .kn.voll{background:#fff;color:#000;flex:1.5}
  .kapo{display:flex;gap:6px}
  .kapo span{border:2px solid #fff;border-radius:7px;padding:0 7px;font-size:15px;font-weight:700}

  /* Text-Ansicht (wie Fassung 7) */
  .bk{background:#000;color:#fff;padding:10px 16px 10px;flex:none;display:flex;flex-direction:column;gap:6px}
  .pille{height:30px;padding:0 12px;border-radius:15px;display:inline-flex;align-items:center;font-size:15px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;border:2.5px solid #000}
  .text{font-family:'Barlow Condensed',sans-serif;font-size:29px;line-height:1.08;font-weight:700}
  .text p{margin:0}
  .jetzt{border:2.5px solid #000;border-radius:12px;padding:3px 8px 4px 22px;position:relative}
  .jetzt:before{content:"";position:absolute;left:5px;top:12px;border-left:13px solid #000;border-top:10px solid transparent;border-bottom:10px solid transparent}

  /* Set wechseln */
  .schleier{position:absolute;left:0;right:0;top:120px;bottom:0;background:rgba(255,255,255,.0)}
  .klappe{position:absolute;left:10px;right:10px;top:4px;background:#fff;border:3px solid #000;border-radius:14px;padding:6px 0 8px;box-shadow:0 0 0 400px rgba(255,255,255,.72)}
  .klappe .zeile{margin:0 8px}
</style>
</head>

  <figcaption><b>6 · Reiter „Archiv“</b>Ein Tipp auf „Archiv“: alle Songs A–Z, Tempo-Filter oben, die Leiste bleibt unten. Hier gilt dasselbe Wischen: rechts = kommt im Set als Nächstes, links = ans Ende vom Set. Songs, die schon im Gig sind, stehen grau.</figcaption>
