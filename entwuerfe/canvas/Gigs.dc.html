<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Gigs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#000}a:hover{color:#000}
</style>
</helmet>
<div style="width: 360px; height: 600px; box-sizing: border-box; background: #fff; color: #000; font-family: 'Barlow Semi Condensed', 'Arial Narrow', sans-serif; display: flex; flex-direction: column">
  <div style="background: #000; color: #fff; padding: 10px 18px; display: flex; justify-content: space-between; align-items: center">
    <div>
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em">BÜHNENBLATT</div>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.05">Gigs</div>
    </div>
    <div style="font-size: 13px; font-weight: 600; text-align: right; line-height: 1.3">nichts läuft<br>bereit</div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 12px 14px 4px; border: 2.5px solid #000; border-radius: 12px; overflow: hidden">
    <button style="height: 44px; border: none; background: #000; color: #fff; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 17px; font-weight: 700">Gigs</button>
    <button style="height: 44px; border: none; border-left: 2px solid #000; background: #fff; color: #000; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 17px; font-weight: 700">Archiv</button>
  </div>
  <div style="flex-grow: 1; display: flex; flex-direction: column; padding: 6px 14px 0; gap: 10px">
    <sc-for list="{{gigs}}" as="g" hint-placeholder-count="4">
      <button style="height: 78px; border: {{g.border}}; border-radius: 14px; background: #fff; color: #000; padding: 0 12px 0 14px; display: flex; align-items: center; gap: 12px; text-align: left; font-family: 'Barlow Semi Condensed', sans-serif">
        <div style="width: 50px; height: 60px; box-sizing: border-box; border: 2px solid #000; border-radius: 10px; background: {{g.dbg}}; color: {{g.dfg}}; display: flex; flex-direction: column; align-items: center; justify-content: center">
          <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em">{{g.wd}}</span>
          <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 700; line-height: 1">{{g.day}}</span>
          <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em">{{g.mon}}</span>
        </div>
        <div style="flex-grow: 1; min-width: 0">
          <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.05">{{g.name}}</div>
          <div style="font-size: 14px; font-weight: 600">{{g.info}}</div>
        </div>
        <svg width="12" height="20" viewBox="0 0 12 20" aria-hidden="true"><path d="M2 2 L10 10 L2 18" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </button>
    </sc-for>
  </div>
  <div style="display: flex; gap: 10px; padding: 8px 14px 14px">
    <button style="flex-grow: 1; height: 56px; border: 2.5px solid #000; border-radius: 14px; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 18px; font-weight: 700">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 2 v14 M2 9 h14" stroke="#fff" stroke-width="3" stroke-linecap="round"></path></svg>
      <span>Neuer Gig</span>
    </button>
    <div style="width: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">Seite 1 von 1</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic {
renderVals() {
const gigs = [
  { wd: 'SA', day: '14', mon: 'NOV', name: 'Sommerfest', info: '3 Sets · 34 Songs · 2:15 h', next: true },
  { wd: 'FR', day: '20', mon: 'NOV', name: 'Hochzeit Berger', info: '4 Sets · 46 Songs · 3:05 h' },
  { wd: 'SA', day: '05', mon: 'DEZ', name: 'Weihnachtsfeier', info: '2 Sets · 22 Songs · 1:30 h' },
  { wd: 'SA', day: '31', mon: 'DEZ', name: 'Silvester', info: '5 Sets · 58 Songs · 4:00 h' }
].map((g) => ({ ...g, next: !!g.next, border: g.next ? '3px solid #000' : '1.5px solid #000', dbg: g.next ? '#000' : '#fff', dfg: g.next ? '#fff' : '#000' }));
return { gigs };
}
}
</script>
</body>
</html>
