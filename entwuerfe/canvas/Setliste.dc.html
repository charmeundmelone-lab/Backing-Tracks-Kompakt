<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Setliste blättern</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#000}a:hover{color:#000}
</style>
</helmet>
<div style="width: 360px; height: 600px; box-sizing: border-box; background: #fff; color: #000; font-family: 'Barlow Semi Condensed', 'Arial Narrow', sans-serif; display: flex; flex-direction: column">
  <button aria-label="Zurück zur Bühne" style="background: #000; color: #fff; border: none; padding: 9px 10px 9px 18px; display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; font-family: 'Barlow Semi Condensed', sans-serif">
    <div style="flex-grow: 1; min-width: 0">
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em">JETZT · NOCH 2:41</div>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.05">Country Roads</div>
    </div>
    <div style="height: 44px; padding: 0 12px; border-radius: 10px; background: #fff; color: #000; display: flex; align-items: center; gap: 7px; font-size: 16px; font-weight: 700">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 3 h14 M2 7.5 h14 M2 12 h9" stroke="#000" stroke-width="2.5" stroke-linecap="round"></path></svg>
      <span>Bühne</span>
    </div>
  </button>
  <div style="display: flex; justify-content: space-between; padding: 8px 20px 2px; font-size: 13px; font-weight: 700; letter-spacing: 0.08em">
    <span>SOMMERFEST · SET 2 VON 3</span>
    <span>2 / 12 · NOCH 38 MIN</span>
  </div>
  <div style="flex-grow: 1; display: flex; flex-direction: column; padding: 4px 0 0">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
      <sc-if value="{{r.current}}" hint-placeholder-val="{{false}}">
        <div style="height: 62px; box-sizing: border-box; margin: 2px 10px; padding: 0 10px 0 8px; background: #000; color: #fff; border-radius: 12px; display: flex; align-items: center; gap: 10px">
          <svg width="26" height="26" viewBox="0 0 26 26" aria-label="läuft"><path d="M7 4 L22 13 L7 22 Z" fill="#fff"></path></svg>
          <div style="flex-grow: 1; min-width: 0">
            <div style="font-size: 22px; font-weight: 700; line-height: 1.1">{{r.title}}</div>
            <div style="font-size: 14px; font-weight: 500">{{r.info}}</div>
          </div>
          <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700">{{r.time}}</div>
        </div>
      </sc-if>
      <sc-if value="{{r.normal}}" hint-placeholder-val="{{true}}">
        <div style="height: 62px; box-sizing: border-box; margin: 2px 10px; padding: 0 10px 0 8px; border-bottom: 1px solid #000; display: flex; align-items: center; gap: 10px">
          <div style="width: 26px; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700">
            <sc-if value="{{r.played}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 22 22" aria-label="gespielt"><circle cx="11" cy="11" r="10" fill="#000"></circle><path d="M6 11.5 l3.5 3.5 l6.5 -7" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>
            <sc-if value="{{r.open}}" hint-placeholder-val="{{true}}">{{r.nr}}</sc-if>
          </div>
          <div style="flex-grow: 1; min-width: 0">
            <div style="font-size: 22px; font-weight: 600; line-height: 1.1; text-decoration: {{r.deco}}">{{r.title}}</div>
            <div style="font-size: 14px; font-weight: 500">{{r.info}}</div>
          </div>
          <sc-if value="{{r.voice}}" hint-placeholder-val="{{false}}">
            <svg width="16" height="20" viewBox="0 0 14 18" aria-label="mit Ansage"><rect x="3.5" y="1" width="7" height="10" rx="3.5" fill="none" stroke="#000" stroke-width="2"></rect><path d="M1 8.5 a6 6 0 0 0 12 0 M7 14.5 v2.5" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"></path></svg>
          </sc-if>
          <sc-if value="{{r.pause}}" hint-placeholder-val="{{false}}">
            <span style="border: 2px solid #000; border-radius: 6px; padding: 0 5px; font-size: 13px; font-weight: 700">{{r.pause}}</span>
          </sc-if>
          <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 600; width: 40px; text-align: right">{{r.time}}</div>
        </div>
      </sc-if>
    </sc-for>
  </div>
  <div style="display: flex; align-items: center; gap: 10px; padding: 8px 14px 14px">
    <button aria-label="Vorige Seite" style="width: 64px; height: 56px; border: 2.5px solid #000; border-radius: 14px; background: #fff; display: flex; align-items: center; justify-content: center; padding: 0; opacity: 1">
      <svg width="16" height="24" viewBox="0 0 16 24" aria-hidden="true"><path d="M13 3 L4 12 L13 21" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
    <button aria-label="Seitenübersicht öffnen" style="flex-grow: 1; height: 56px; border: none; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; padding: 0; font-family: 'Barlow Semi Condensed', sans-serif; color: #000">
      <span style="font-size: 17px; font-weight: 700">Seite 1 von 2</span>
      <span style="display: flex; gap: 6px">
        <span style="width: 18px; height: 5px; border-radius: 3px; background: #000"></span>
        <span style="width: 18px; height: 5px; border-radius: 3px; border: 1.5px solid #000; box-sizing: border-box"></span>
      </span>
    </button>
    <button aria-label="Nächste Seite" style="width: 64px; height: 56px; border: 2.5px solid #000; border-radius: 14px; background: #000; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="16" height="24" viewBox="0 0 16 24" aria-hidden="true"><path d="M3 3 L12 12 L3 21" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic {
renderVals() {
const rows = [
  { nr: 1, title: 'No Woman No Cry', info: 'C · 72 BPM', time: '4:12', played: true },
  { nr: 2, title: 'Forget You', info: 'C · 127 BPM', time: '3:42', played: true, voice: true },
  { nr: 3, title: 'Country Roads', info: 'A · 164 BPM', time: '2:41', current: true },
  { nr: 4, title: 'Dancing Queen', info: 'G · 101 BPM', time: '3:51', voice: true },
  { nr: 5, title: 'Get Lucky', info: 'Bm dorisch · 116 BPM', time: '4:08', pause: '0:30' },
  { nr: 6, title: 'Grenade', info: 'Bm · Kapo 2 · 110 BPM', time: '3:42' }
].map((r) => ({ ...r, normal: !r.current, open: !r.played, voice: !!r.voice, pause: r.pause || false, played: !!r.played, current: !!r.current, deco: r.played ? 'line-through' : 'none' }));
return { rows };
}
}
</script>
</body>
</html>
