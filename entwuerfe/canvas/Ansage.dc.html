<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Ansage und Pause</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#000}a:hover{color:#000}
</style>
</helmet>
<div style="width: 360px; height: 600px; box-sizing: border-box; background: #fff; color: #000; font-family: 'Barlow Semi Condensed', 'Arial Narrow', sans-serif; display: flex; flex-direction: column">
  <div style="background: #000; color: #fff; padding: 12px 18px; display: flex; align-items: center; gap: 10px">
    <svg width="18" height="24" viewBox="0 0 14 18" aria-hidden="true"><rect x="3.5" y="1" width="7" height="10" rx="3.5" fill="none" stroke="#fff" stroke-width="2"></rect><path d="M1 8.5 a6 6 0 0 0 12 0 M7 14.5 v2.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"></path></svg>
    <div>
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em">ZWISCHEN DEN SONGS</div>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.05">Ansage läuft im Ohr</div>
    </div>
  </div>
  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 18px">
    <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.16em">GLEICH GEHT ES WEITER IN</div>
    <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 150px; font-weight: 700; line-height: 0.95; font-variant-numeric: tabular-nums; letter-spacing: -0.02em">0:18</div>
    <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; width: 250px; margin-top: 6px" aria-label="Fortschritt der Pause">
      <div style="height: 8px; background: #000"></div><div style="height: 8px; background: #000"></div><div style="height: 8px; background: #000"></div><div style="height: 8px; background: #000"></div>
      <div style="height: 8px; box-sizing: border-box; border: 1.5px solid #000"></div><div style="height: 8px; box-sizing: border-box; border: 1.5px solid #000"></div><div style="height: 8px; box-sizing: border-box; border: 1.5px solid #000"></div><div style="height: 8px; box-sizing: border-box; border: 1.5px solid #000"></div><div style="height: 8px; box-sizing: border-box; border: 1.5px solid #000"></div><div style="height: 8px; box-sizing: border-box; border: 1.5px solid #000"></div>
    </div>
  </div>
  <div style="margin: 0 18px; border-top: 2.5px solid #000; padding: 12px 0 14px">
    <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em">ALS NÄCHSTES · 4 / 12</div>
    <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 700; line-height: 1.05">Dancing Queen</div>
    <div style="font-size: 16px; font-weight: 600">G · 101 BPM · 3:51</div>
  </div>
  <div style="display: grid; grid-template-columns: 1fr 1fr 1.6fr; gap: 8px; padding: 0 14px 14px">
    <button aria-label="Zur Setliste" style="height: 56px; border: 2.5px solid #000; border-radius: 14px; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0; color: #000; font-family: 'Barlow Semi Condensed', sans-serif">
      <svg width="22" height="16" viewBox="0 0 22 16" aria-hidden="true"><path d="M7 2 h13 M7 8 h13 M7 14 h13" stroke="#000" stroke-width="2.5" stroke-linecap="round"></path><circle cx="2.5" cy="2" r="1.6" fill="#000"></circle><circle cx="2.5" cy="8" r="1.6" fill="#000"></circle><circle cx="2.5" cy="14" r="1.6" fill="#000"></circle></svg>
      <span style="font-size: 12px; font-weight: 700">Liste</span>
    </button>
    <button style="height: 56px; border: 2.5px solid #000; border-radius: 14px; background: #fff; color: #000; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 17px; font-weight: 700">Stopp</button>
    <button style="height: 56px; border: 2.5px solid #000; border-radius: 14px; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 17px; font-weight: 700">
      <span>Starten</span>
      <svg width="20" height="16" viewBox="0 0 26 20" aria-hidden="true"><path d="M2 2 L15 10 L2 18 Z" fill="#fff"></path><rect x="18" y="2" width="5" height="16" rx="1" fill="#fff"></rect></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":600}}'>

return {};
}
}
</script>
</body>
</html>
