<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Set wechseln</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#000}a:hover{color:#000}
</style>
</helmet>
<div style="width: 360px; height: 600px; box-sizing: border-box; background: #fff; color: #000; font-family: 'Barlow Semi Condensed', 'Arial Narrow', sans-serif; display: flex; flex-direction: column">
  <button aria-label="Zurück zur Bühne" style="background: #000; color: #fff; border: none; padding: 9px 10px 9px 18px; display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; font-family: 'Barlow Semi Condensed', sans-serif">
    <div style="flex-grow: 1; min-width: 0">
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em">JETZT · NOCH 2:41</div>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.05">Country Roads</div>
    </div>
    <div style="height: 44px; padding: 0 12px; border-radius: 10px; background: #fff; color: #000; display: flex; align-items: center; gap: 7px; font-size: 16px; font-weight: 700">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 3 h14 M2 7.5 h14 M2 12 h9" stroke="#000" stroke-width="2.5" stroke-linecap="round"></path></svg>
      <span>Bühne</span>
    </div>
  </button>
  <div style="display: flex; align-items: center; gap: 8px; padding: 8px 14px 4px">
    <button aria-label="Zurück zu den Gigs" style="width: 40px; height: 40px; border: none; background: #fff; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="14" height="22" viewBox="0 0 14 22" aria-hidden="true"><path d="M11 3 L3 11 L11 19" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
    <div style="flex-grow: 1">
      <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 700; line-height: 1">Sommerfest</div>
      <div style="font-size: 13px; font-weight: 600">Sa 14.11. · 3 Sets · 34 Songs</div>
    </div>
  </div>
  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px; padding: 6px 14px 0">
    <sc-for list="{{sets}}" as="s" hint-placeholder-count="3">
      <button style="height: 96px; border: 2.5px solid #000; border-radius: 14px; background: {{s.bg}}; color: {{s.fg}}; padding: 10px 14px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; font-family: 'Barlow Semi Condensed', sans-serif">
        <div style="display: flex; justify-content: space-between; align-items: baseline; width: 100%">
          <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; line-height: 1">{{s.nr}} · {{s.name}}</span>
          <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em">{{s.tag}}</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 3px; width: 100%">
          <sc-for list="{{s.boxes}}" as="b" hint-placeholder-count="12">
            <div style="height: 8px; box-sizing: border-box; border: 1.5px solid {{s.fg}}; background: {{b.fill}}"></div>
          </sc-for>
        </div>
        <div style="font-size: 15px; font-weight: 600">{{s.info}}</div>
      </button>
    </sc-for>
  </div>
  <button style="margin: 10px 14px 0; height: 52px; border: none; border-top: 1.5px solid #000; background: #fff; color: #000; display: flex; align-items: center; gap: 12px; padding: 0 4px; text-align: left; font-family: 'Barlow Semi Condensed', sans-serif">
    <span style="width: 26px; height: 26px; box-sizing: border-box; border: 2.5px solid #000; border-radius: 6px; background: #000; display: flex; align-items: center; justify-content: center">
      <svg width="14" height="12" viewBox="0 0 14 12" aria-hidden="true"><path d="M2 6 l3.5 3.5 l6.5 -7" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </span>
    <span style="flex-grow: 1; font-size: 17px; font-weight: 700; line-height: 1.15">Nach dem Set automatisch ins nächste</span>
  </button>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 6px 14px 14px">
    <button style="height: 50px; border: 2.5px solid #000; border-radius: 14px; background: #fff; color: #000; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 16px; font-weight: 700">Sets sortieren</button>
    <button style="height: 50px; border: 2.5px solid #000; border-radius: 14px; background: #fff; color: #000; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 16px; font-weight: 700">Neues Set</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic {
renderVals() {
const mk = (total, done, dark) => Array.from({ length: 12 }, (_, i) => ({ fill: i < done ? (dark ? '#fff' : '#000') : 'transparent' }));
const sets = [
  { nr: 1, name: 'Ankommen', tag: 'GESPIELT', info: '12 von 12 · 46 min', boxes: mk(12, 12, false), bg: '#fff', fg: '#000' },
  { nr: 2, name: 'Tanzset', tag: 'LÄUFT', info: '2 von 12 · noch 38 min', boxes: mk(12, 2, true), bg: '#000', fg: '#fff' },
  { nr: 3, name: 'Finale', tag: 'ALS NÄCHSTES', info: '0 von 10 · 41 min', boxes: mk(10, 0, false), bg: '#fff', fg: '#000' }
];
return { sets };
}
}
</script>
</body>
</html>
