<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Archiv: Sprung A–Z</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#000}a:hover{color:#000}
</style>
</helmet>
<div style="width: 360px; height: 600px; box-sizing: border-box; background: #fff; color: #000; font-family: 'Barlow Semi Condensed', 'Arial Narrow', sans-serif; display: flex; flex-direction: column">
  <div style="background: #000; color: #fff; padding: 10px 18px; display: flex; justify-content: space-between; align-items: center">
    <div>
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em">ARCHIV · 86 SONGS</div>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.05">Springe zu …</div>
    </div>
    <div style="font-size: 13px; font-weight: 600; text-align: right; line-height: 1.3">jetzt auf<br>Seite 3 von 13</div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 12px 14px 0; border: 2.5px solid #000; border-radius: 12px; overflow: hidden">
    <button style="height: 40px; border: none; background: #000; color: #fff; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 15px; font-weight: 700">Alle</button>
    <button style="height: 40px; border: none; border-left: 2px solid #000; background: #fff; color: #000; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 15px; font-weight: 700">Langsam</button>
    <button style="height: 40px; border: none; border-left: 2px solid #000; background: #fff; color: #000; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 15px; font-weight: 700">Mittel</button>
    <button style="height: 40px; border: none; border-left: 2px solid #000; background: #fff; color: #000; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 15px; font-weight: 700">Schnell</button>
  </div>
  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; padding: 12px 14px 0; flex-grow: 1; align-content: start">
    <sc-for list="{{letters}}" as="l" hint-placeholder-count="27">
      <sc-if value="{{l.has}}" hint-placeholder-val="{{true}}">
        <button style="height: 58px; border: 2.5px solid {{l.border}}; border-radius: 12px; background: {{l.bg}}; color: {{l.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding: 0; font-family: 'Barlow Condensed', sans-serif">
          <span style="font-size: 28px; font-weight: 700; line-height: 1">{{l.ch}}</span>
          <span style="font-family: 'Barlow Semi Condensed', sans-serif; font-size: 12px; font-weight: 600">{{l.n}}</span>
        </button>
      </sc-if>
      <sc-if value="{{l.empty}}" hint-placeholder-val="{{false}}">
        <div aria-label="keine Songs" style="height: 58px; box-sizing: border-box; border: 1.5px dashed #000; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 600">{{l.ch}}</div>
      </sc-if>
    </sc-for>
  </div>
  <div style="padding: 8px 14px 14px">
    <button style="width: 100%; height: 52px; border: 2.5px solid #000; border-radius: 14px; background: #fff; color: #000; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 17px; font-weight: 700">Zurück zur Liste</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic {
renderVals() {
const counts = { A: 4, B: 6, C: 5, D: 7, E: 2, F: 3, G: 4, H: 5, I: 3, J: 2, K: 1, L: 4, M: 6, N: 3, O: 2, P: 3, R: 5, S: 9, T: 4, U: 1, W: 4, Y: 1, '#': 2 };
const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').concat(['#']);
const letters = chars.map((ch) => {
  const n = counts[ch] || 0;
  const active = ch === 'D';
  return { ch, n: n === 1 ? '1 Song' : n + ' Songs', has: n > 0, empty: n === 0, bg: active ? '#000' : '#fff', fg: active ? '#fff' : '#000', border: '#000' };
});
return { letters };
}
}
</script>
</body>
</html>
