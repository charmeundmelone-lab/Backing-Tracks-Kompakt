<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Archiv</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#000}a:hover{color:#000}
</style>
</helmet>
<div style="width: 360px; height: 600px; box-sizing: border-box; background: #fff; color: #000; font-family: 'Barlow Semi Condensed', 'Arial Narrow', sans-serif; display: flex; flex-direction: column">
  <div style="background: #000; color: #fff; padding: 8px 10px 8px 18px; display: flex; justify-content: space-between; align-items: center">
    <div>
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em">HINZUFÜGEN ZU</div>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.05">Tanzset · 12 Songs</div>
    </div>
    <button style="height: 40px; padding: 0 16px; border: none; border-radius: 10px; background: #fff; color: #000; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 17px; font-weight: 700">Fertig</button>
  </div>
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 18px 4px">
    <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 800; line-height: 1">D</span>
    <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em">ALLE TEMPI · 86 SONGS</span>
  </div>
  <div style="flex-grow: 1; display: flex; flex-direction: column">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <div style="height: 64px; box-sizing: border-box; margin: 0 10px; padding: 0 4px 0 8px; border-bottom: 1px solid #000; display: flex; align-items: center; gap: 10px">
        <div style="flex-grow: 1; min-width: 0">
          <div style="font-size: 21px; font-weight: 600; line-height: 1.1">{{r.title}}</div>
          <div style="font-size: 14px; font-weight: 500">{{r.info}}</div>
        </div>
        <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 19px; font-weight: 600">{{r.time}}</div>
        <sc-if value="{{r.inSet}}" hint-placeholder-val="{{false}}">
          <span aria-label="schon im Set" style="width: 48px; height: 48px; box-sizing: border-box; border-radius: 12px; background: #000; display: flex; align-items: center; justify-content: center">
            <svg width="18" height="14" viewBox="0 0 18 14" aria-hidden="true"><path d="M2 7 l5 5 l9 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </span>
        </sc-if>
        <sc-if value="{{r.add}}" hint-placeholder-val="{{true}}">
          <button aria-label="Zum Set hinzufügen" style="width: 48px; height: 48px; border: 2.5px solid #000; border-radius: 12px; background: #fff; display: flex; align-items: center; justify-content: center; padding: 0">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 2 v14 M2 9 h14" stroke="#000" stroke-width="3" stroke-linecap="round"></path></svg>
          </button>
        </sc-if>
      </div>
    </sc-for>
  </div>
  <div style="display: flex; align-items: center; gap: 10px; padding: 8px 14px 14px">
    <button aria-label="Vorige Seite" style="width: 64px; height: 56px; border: 2.5px solid #000; border-radius: 14px; background: #fff; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="16" height="24" viewBox="0 0 16 24" aria-hidden="true"><path d="M13 3 L4 12 L13 21" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
    <button aria-label="A bis Z öffnen" style="flex-grow: 1; height: 56px; border: 1.5px dashed #000; border-radius: 14px; background: #fff; color: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0; font-family: 'Barlow Semi Condensed', sans-serif">
      <span style="font-size: 17px; font-weight: 700">A–Z · Seite 3 / 13</span>
      <span style="font-size: 12px; font-weight: 600">tippen zum Springen</span>
    </button>
    <button aria-label="Nächste Seite" style="width: 64px; height: 56px; border: 2.5px solid #000; border-radius: 14px; background: #000; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="16" height="24" viewBox="0 0 16 24" aria-hidden="true"><path d="M3 3 L12 12 L3 21" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic {
renderVals() {
const rows = [
  { title: 'Dancing Queen', info: 'G · 101 BPM', time: '3:51', inSet: true },
  { title: 'Don’t Stop Believin’', info: 'D · Kapo 2 · 119 BPM', time: '4:09' },
  { title: 'Don’t Stop Me Now', info: 'E · Kapo 2 · 156 BPM', time: '3:29', inSet: true },
  { title: 'Dreams', info: 'Am · 120 BPM', time: '4:14' },
  { title: 'Drive', info: 'Bm · 92 BPM', time: '3:56' },
  { title: 'Dakota', info: 'E · 147 BPM', time: '4:57' }
].map((r) => ({ ...r, inSet: !!r.inSet, add: !r.inSet }));
return { rows };
}
}
</script>
</body>
</html>
