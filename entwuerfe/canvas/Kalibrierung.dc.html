<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Lyrics einmessen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#000}a:hover{color:#000}
</style>
</helmet>
<div style="width: 360px; height: 600px; box-sizing: border-box; background: #fff; color: #000; font-family: 'Barlow Semi Condensed', 'Arial Narrow', sans-serif; display: flex; flex-direction: column">
  <div style="background: #000; color: #fff; padding: 10px 18px; display: flex; justify-content: space-between; align-items: center">
    <div>
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em">LYRICS EINMESSEN</div>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.05">Dancing Queen</div>
    </div>
    <div style="text-align: right; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums">1:12<span style="font-size: 16px; font-weight: 600"> / 3:51</span></div>
  </div>
  <div style="padding: 12px 18px 6px; font-size: 15px; font-weight: 600; line-height: 1.3">Der Song läuft. Tippe genau dann, wenn der nächste Abschnitt anfängt.</div>
  <div style="flex-grow: 1; display: flex; flex-direction: column; padding: 0 14px">
    <sc-for list="{{parts}}" as="p" hint-placeholder-count="7">
      <div style="height: 38px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 8px; border: {{p.border}}; border-radius: 10px">
        <span style="width: 22px; display: flex; justify-content: center">
          <sc-if value="{{p.done}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 22 22" aria-label="gesetzt"><circle cx="11" cy="11" r="10" fill="#000"></circle><path d="M6 11.5 l3.5 3.5 l6.5 -7" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>
          <sc-if value="{{p.next}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 16 16" aria-label="als Nächstes"><path d="M3 2 L13 8 L3 14 Z" fill="#000"></path></svg></sc-if>
          <sc-if value="{{p.open}}" hint-placeholder-val="{{false}}"><span style="width: 12px; height: 12px; box-sizing: border-box; border: 2px solid #000; border-radius: 6px"></span></sc-if>
        </span>
        <span style="flex-grow: 1; font-size: 18px; font-weight: {{p.weight}}">{{p.name}}</span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 600">{{p.time}}</span>
      </div>
    </sc-for>
  </div>
  <div style="padding: 10px 14px 0">
    <button style="width: 100%; height: 92px; border: none; border-radius: 16px; background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: 'Barlow Semi Condensed', sans-serif">
      <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.16em">JETZT BEGINNT</span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 700; line-height: 1">Strophe 2</span>
    </button>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 10px 14px 14px">
    <button style="height: 50px; border: 2.5px solid #000; border-radius: 14px; background: #fff; color: #000; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 16px; font-weight: 700">Letzten Tipp löschen</button>
    <button style="height: 50px; border: 2.5px solid #000; border-radius: 14px; background: #fff; color: #000; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 16px; font-weight: 700">10 s zurück</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":600}}'>
class Component extends DCLogic {
renderVals() {
const raw = [
  { name: 'Intro', time: '0:00', s: 'done' },
  { name: 'Strophe 1', time: '0:14', s: 'done' },
  { name: 'Refrain', time: '0:46', s: 'done' },
  { name: 'Strophe 2', time: '–', s: 'next' },
  { name: 'Refrain', time: '–', s: 'open' },
  { name: 'Bridge', time: '–', s: 'open' },
  { name: 'Refrain', time: '–', s: 'open' }
];
const parts = raw.map((p) => ({ ...p, done: p.s === 'done', next: p.s === 'next', open: p.s === 'open', border: p.s === 'next' ? '2.5px dashed #000' : '2.5px solid transparent', weight: p.s === 'next' ? 700 : 600 }));
return { parts };
}
}
</script>
</body>
</html>
