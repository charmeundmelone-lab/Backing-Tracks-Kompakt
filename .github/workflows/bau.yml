name: Bau

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  bau:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests und Release-APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease -PversionCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: backing-tracks-kompakt-apk
          path: app/build/outputs/apk/release/app-release.apk
